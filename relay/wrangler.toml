# The Yurt network relay (yurt-playground#380). Deploy from this directory
# with `wrangler deploy`, after `wrangler secret put RELAY_SECRET` (at least
# 32 random characters), `wrangler secret put TURNSTILE_SECRET` (the
# Turnstile widget's secret key) and setting RELAY_ORIGINS below. Until all
# are set the Worker answers 503 to everything.
name = "yurt-relay"
main = "worker.js"
compatibility_date = "2025-09-01"

[vars]
# The playground's exact origins, comma-separated (https://host, no path):
# only their pages get tokens.
RELAY_ORIGINS = ""

# /token per caller (IPv4 address or IPv6 /64), counted per Cloudflare
# location, on top of the relay's own per-isolate limit. Required: without
# it the Worker answers 503. namespace_id is any integer unique in the
# account.
[[ratelimits]]
name = "TOKEN_LIMITER"
namespace_id = "38001"
simple = { limit = 10, period = 60 }
