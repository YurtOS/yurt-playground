name: Desktop app

# The macOS app (scripts/build-desktop.sh): the built site plus a compiled
# local server, zipped per architecture. Every pull request builds it and
# runs the app acceptance; a merge to main also publishes the zips as a
# GitHub release, which the home page links through
# releases/latest/download/. workflow_dispatch only works once this file is
# on main.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  # dist/ is built the way deploy-pages.yml builds it: pinned siblings, the
  # published Jupyter payload and blobs, the JupyterLite site. Kept in step
  # with that workflow by hand.
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: playground
      - name: Read pins
        id: pins
        working-directory: playground
        run: |
          echo "kernel_rev=$(jq -r .kernelWasm.rev artifacts/pins.json)" >> "$GITHUB_OUTPUT"
          echo "jupyter_rev=$(jq -r .yurtJupyterRev artifacts/jupyter-requirements.lock)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: YurtOS/yurtos-kernel
          token: ${{ secrets.KERNEL_CHECKOUT_TOKEN }}
          ref: ${{ steps.pins.outputs.kernel_rev }}
          path: yurtos-kernel
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: YurtOS/yurt-jupyter
          token: ${{ secrets.KERNEL_CHECKOUT_TOKEN }}
          ref: ${{ steps.pins.outputs.jupyter_rev }}
          path: yurt-jupyter
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.7.14
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: host-python
        with:
          python-version: "3.14.0"
          architecture: x64
      - name: Install the Jupyter payload from its release
        working-directory: playground
        env:
          GH_TOKEN: ${{ secrets.KERNEL_CHECKOUT_TOKEN }}
          YURT_JUPYTER_ROOT: ../yurt-jupyter
        run: scripts/install-jupyter-payload.sh
      - name: Materialize locked Jupyter payload
        working-directory: playground
        env:
          HOST_PYTHON: ${{ steps.host-python.outputs.python-path }}
          YURT_JUPYTER_ROOT: ../yurt-jupyter
        run: deno run --allow-read --allow-write --allow-env --allow-run scripts/materialize-jupyter.ts
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: playground/jupyterlite/yurt-kernel/package-lock.json
      - name: Build the JupyterLite site
        working-directory: playground
        env:
          JUPYTERLITE_PYTHON: ${{ steps.host-python.outputs.python-path }}
        run: |
          "$JUPYTERLITE_PYTHON" -m pip install --disable-pip-version-check -q -r jupyterlite/requirements.txt
          jupyterlite/build.sh
      - name: Install the pinned kernel wasm and playground image
        working-directory: playground
        env:
          GH_TOKEN: ${{ secrets.KERNEL_CHECKOUT_TOKEN }}
        run: scripts/install-pinned-artifacts.sh
      - name: Pin artifacts
        working-directory: playground
        env:
          YURT_KERNEL_ROOT: ../yurtos-kernel
        run: deno task pin
      - name: Build static site
        working-directory: playground
        env:
          YURT_KERNEL_ROOT: ../yurtos-kernel
        run: deno task build-static
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: playground/dist
          if-no-files-found: error

  desktop:
    needs: site
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.7.14
      - name: Build the app for both architectures
        run: |
          scripts/build-desktop.sh --target aarch64-apple-darwin
          scripts/build-desktop.sh --target x86_64-apple-darwin
      - name: Install Chromium for the app acceptance
        run: |
          deno install
          deno run --allow-all node_modules/playwright/cli.js install chromium
      # The runner's own architecture; the other binary is built the same
      # way from the same inputs.
      - name: App acceptance
        run: deno run --allow-all tests/desktop_e2e.ts
      - name: Zip the bundles
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            (cd "dist-desktop/$target" && ditto -c -k --keepParent "Yurt Playground.app" "../Yurt-Playground-$target.zip")
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Yurt-Playground-macos
          path: dist-desktop/*.zip
          if-no-files-found: error

  # The release the home page's download links resolve to. A full release,
  # never a prerelease: releases/latest/download/ ignores prereleases.
  release:
    needs: desktop
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Yurt-Playground-macos
          path: release
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="desktop-$(date -u +%Y%m%d)-${SHA:0:7}"
          kernel=$(jq -r .kernelWasm.release artifacts/pins.json)
          image=$(jq -r .image.release artifacts/pins.json)
          gh release create "$tag" \
            --target "$SHA" \
            --title "Yurt Playground for macOS ($tag)" \
            --notes "Built from ${SHA:0:7} with kernel $kernel and image $image. Not notarized: right-click the app and choose Open the first time." \
            release/Yurt-Playground-aarch64-apple-darwin.zip \
            release/Yurt-Playground-x86_64-apple-darwin.zip
