name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: playground
      - name: Read kernel pin
        id: pins
        working-directory: playground
        run: |
          echo "kernel_rev=$(jq -r .kernelWasm.rev artifacts/pins.json)" >> "$GITHUB_OUTPUT"
          echo "ports_rev=$(jq -r .image.rev artifacts/pins.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: YurtOS/yurtos-kernel
          ref: ${{ steps.pins.outputs.kernel_rev }}
          path: yurtos-kernel
      - uses: actions/checkout@v7
        with:
          repository: YurtOS/yurt-ports
          ref: ${{ steps.pins.outputs.ports_rev }}
          path: yurt-ports
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32-wasip1,wasm32-wasip1-threads
          components: rust-src
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Build pinned kernel wasm
        working-directory: yurtos-kernel
        run: scripts/build-kernel-wasm.sh
      - name: Materialize pinned playground image
        working-directory: yurt-ports
        env:
          YURT_KERNEL_ROOT: ${{ github.workspace }}/yurtos-kernel
          HOST_PYTHON: python
        run: |
          scripts/build-all-ports.sh --only zlib openssl sqlite busybox cpython
          ports/playground-image/scripts/package.sh
      - name: fmt
        working-directory: playground
        run: deno fmt --check
      - name: lint
        working-directory: playground
        run: deno lint
      - name: check
        working-directory: playground
        run: deno check "**/*.ts"
      - name: test
        working-directory: playground
        env:
          YURT_KERNEL_ROOT: ../yurtos-kernel
          YURT_PORTS_ROOT: ../yurt-ports
        run: deno test --no-check --allow-read --allow-write --allow-env --allow-net --allow-run
