name: CI

# Two tiers (YurtOS/yurt-sandbox#367: every pull request's CI under 5
# minutes). A pull request runs the quick tier: fmt / lint, the test shards
# and the short acceptance scenes. The scenes that take over 5 minutes
# (MERGE_TIER in `checks`) are the merge tier: they run on a push to main
# and on a workflow_dispatch, and on a pull request only while it carries the
# `ci:full` label. Adding the label starts a run (the `labeled` type); the
# label is read on every event, so while it is on every push runs them.
# Without it a merge-tier break shows up in main's run, after the merge (and
# after deploy-pages.yml, which does not wait for this workflow, deployed it).
#
# A push to main runs every acceptance scene and skips the test shards:
# deploy-pages.yml runs that same deno test suite on the same commit before
# it deploys. The desktop installers and their GitHub release are cut by
# release-desktop.yml when the release train asks
# (scripts/release-playground.sh).
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:

# The workflow token can read the repository and nothing else; the
# cross-repo credentials come from named secrets.
# A push on top of a push to a pull request runs the newest tree only: the
# superseded run's test and acceptance legs are cancelled. Main's runs are
# never cancelled, so every merge's merge-tier result is kept.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # The playground-only gate. fmt and lint need no sibling checkout, so this is
  # the one signal that survives a missing cross-repo token. deno check is not
  # here: it resolves @yurt/* into the kernel checkout, so it belongs to the
  # integration job.
  checks:
    name: fmt / lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Also decides whether the integration job can run: a job is billed by
    # the minute rounded up, so the ten-second token check rides here rather
    # than on a runner of its own.
    outputs:
      present: ${{ steps.token.outputs.present }}
      exclude: ${{ steps.tier.outputs.exclude }}
    steps:
      # Which acceptance scenes this run leaves out, as the matrix's
      # `exclude`: the merge tier on a pull request without `ci:full`,
      # nothing otherwise. First, so a later step's failure still leaves the
      # legs a valid matrix. layout_test.ts checks MERGE_TIER against the
      # scene list.
      - name: Choose the tier
        id: tier
        env:
          MERGE_TIER: playground jupyterlite slim
          FULL: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: |
          set -euo pipefail
          if [ "$FULL" = true ]; then
            exclude='[]'
            echo "### Tier: full (every acceptance scene)" >> "$GITHUB_STEP_SUMMARY"
          else
            read -ra scenes <<< "$MERGE_TIER"
            exclude=$(printf '%s\n' "${scenes[@]}" | jq -Rnc '[inputs | {scene: .}]')
            {
              echo "### Tier: pull request"
              echo
              echo "Not run here (the merge tier): $MERGE_TIER. Add the"
              echo "\`ci:full\` label to run them on this pull request."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "exclude=$exclude" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          # Pinned, not v2.x: deno fmt's output changed between 2.x releases
          # (public/index.html reindents), so a floating formatter turns CI red
          # with no code change and disagrees with what developers run locally.
          deno-version: v2.7.14
      # yurtos-kernel and yurt-jupyter are PRIVATE, and the default
      # GITHUB_TOKEN cannot read another private repository. Without a PAT stored as
      # KERNEL_CHECKOUT_TOKEN the integration job cannot check them out at all, so
      # it announces that loudly instead of dying at "Repository not found".
      - name: Check for the cross-repo checkout token
        id: token
        env:
          KERNEL_CHECKOUT_TOKEN: ${{ secrets.KERNEL_CHECKOUT_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${KERNEL_CHECKOUT_TOKEN:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Integration did not run::KERNEL_CHECKOUT_TOKEN is not set, so the private YurtOS siblings could not be checked out. No kernel, image, or Jupyter payload was built and no artifact-backed test ran."
            {
              echo "### Integration: **not run**"
              echo
              echo '`KERNEL_CHECKOUT_TOKEN` is unset, so the private'
              echo '`yurtos-kernel` and `yurt-jupyter` checkouts'
              echo 'were skipped. Nothing was built and no artifact-backed test'
              echo 'ran — this is not coverage.'
              echo
              echo 'Add a PAT with read access to those repositories as the'
              echo '`KERNEL_CHECKOUT_TOKEN` repository secret to enable it.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: fmt
        run: deno fmt --check
      - name: lint
        run: deno lint

  # The cross-repo work, split so a push waits for the longest leg rather
  # than the sum of all of them (#123). Every leg pays the same ~80 s of
  # site-inputs; what follows is minutes, which is why the split pays.
  # `check` rides the fast shard: it needs the same inputs and takes 4 s.
  tests:
    name: tests (${{ matrix.shard }})
    needs: checks
    # The token step runs first in `checks`, and this gate does not wait for
    # fmt/lint to pass: a formatting nit must not hide the integration result
    # (review). `!cancelled()` overrides the implicit success() on `needs`.
    # Not on a push to main: deploy-pages.yml runs the same suite (see the
    # top).
    if: ${{ !cancelled() && needs.checks.outputs.present == 'true' && github.event_name != 'push' }}
    runs-on: ubuntu-latest
    # Above the step cap plus setup, so a slow leg fails at the step -- with
    # its log tail and a named timeout -- rather than as a bare cancelled
    # job (#123 review round 2). The slowest leg seen took 5.0 min in all.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      # Keep in step with scripts/ci-shards.ts; layout_test.ts asserts it.
      matrix:
        shard: [python, guest, fast]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: playground
      - uses: ./playground/.github/actions/site-inputs
        with:
          token: ${{ secrets.KERNEL_CHECKOUT_TOKEN }}
      # `fast` is the catch-all shard (scripts/ci-shards.ts CATCH_ALL_SHARD);
      # layout_test.ts asserts this condition names it, so renaming the shard
      # cannot leave `deno check` silently unrun (#123 review).
      - name: check
        if: matrix.shard == 'fast'
        working-directory: playground
        run: deno check "**/*.ts"
      - name: test
        timeout-minutes: 7
        working-directory: playground
        env:
          YURT_KERNEL_ROOT: ../yurtos-kernel
          PLAYGROUND_REQUIRE_ARTIFACTS: "1"
        run: |
          set -euo pipefail
          # Not `< <(...)`: a process substitution's failure is invisible to
          # `set -e`, and an empty `files` would make `deno test` discover the
          # whole suite in every shard instead of reporting the error (#123
          # review).
          deno run --allow-read scripts/ci-shards.ts "${{ matrix.shard }}" > /tmp/shard-files
          readarray -t files < <(tr " " "\n" < /tmp/shard-files)
          # `-gt 0` is not enough: a blank line reads back as one empty
          # element, and `deno test ""` discovers the whole suite -- the very
          # thing this guard is for (#123 review round 2). The script exits 3
          # on an empty shard, which `set -e` catches above; this is the belt.
          [ -s /tmp/shard-files ] && [ -n "${files[0]:-}" ] ||
            { echo "no files for shard ${{ matrix.shard }}" >&2; exit 1; }
          echo "shard ${{ matrix.shard }}: ${files[*]}"
          deno test --no-check --allow-read --allow-write --allow-env --allow-net --allow-run "${files[@]}"

  # One browser scene per job: each boots its own sandbox, and two of them
  # on one 4-vCPU runner starve each other (both timed out when tried side
  # by side on a single runner, 2026-09-15) -- separate runners do not.
  acceptance:
    name: acceptance (${{ matrix.scene }})
    needs: checks
    if: ${{ !cancelled() && needs.checks.outputs.present == 'true' }}
    runs-on: ubuntu-latest
    # Above the step cap (11) plus both browser installs at their cap (5 + 5)
    # and setup and build (1.6 min typical, 2.1 worst seen), with ~2 min to
    # spare, for the same reason. A cap costs nothing unless something
    # hangs; the slowest scene took 10.0 min in all.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        scene: [
          playground,
          jupyterlite,
          snapshot,
          notebook_snapshot,
          agent,
          webkit,
          slim,
        ]
        exclude: ${{ fromJSON(needs.checks.outputs.exclude) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: playground
      - uses: ./playground/.github/actions/site-inputs
        with:
          token: ${{ secrets.KERNEL_CHECKOUT_TOKEN }}
      # Chromium, keyed on the pinned playwright version: a hit makes the
      # install a no-op. Release desktop saves it on main, the one scope every
      # pull request can read; after any deno.json change, until it runs
      # again, the legs install from Playwright's CDN, which takes seconds.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.scene != 'webkit'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('playground/deno.json') }}
      # The `webkit` scene runs JavaScriptCore (#2996's engine) in Playwright's
      # own image, which has WebKit and its system libraries for the pinned
      # playwright version. Installing them here meant ~117 MB of Ubuntu
      # packages through apt, at ~60 kB/s on bad days (32 min on #246), and
      # a cache saved here could not help: CI runs on pull requests (and by
      # hand), and a pull request's cache is not visible to the next one. The
      # image is pulled here, not by `docker run` below, so a slow pull fails
      # at this step's 5 min and is tried once more.
      - name: Install the browser for browser acceptance
        id: install
        continue-on-error: true
        timeout-minutes: 5
        working-directory: playground
        env:
          BROWSER: ${{ matrix.scene == 'webkit' && 'webkit' || 'chromium' }}
        run: |
          set -euo pipefail
          if [ "$BROWSER" = webkit ]; then
            version=$(jq -r .imports.playwright deno.json)
            docker pull -q "mcr.microsoft.com/playwright:v${version#npm:playwright@}-noble"
          else
            deno run --allow-all node_modules/playwright/cli.js install chromium
          fi
      - name: Install the browser for browser acceptance (retry)
        if: steps.install.outcome == 'failure'
        timeout-minutes: 5
        working-directory: playground
        env:
          BROWSER: ${{ matrix.scene == 'webkit' && 'webkit' || 'chromium' }}
        # The same script as the step above.
        run: |
          set -euo pipefail
          if [ "$BROWSER" = webkit ]; then
            version=$(jq -r .imports.playwright deno.json)
            docker pull -q "mcr.microsoft.com/playwright:v${version#npm:playwright@}-noble"
          else
            deno run --allow-all node_modules/playwright/cli.js install chromium
          fi
      # The deployable site, built from the inputs above: what the
      # acceptance below boots.
      - name: Build static site
        working-directory: playground
        env:
          YURT_KERNEL_ROOT: ../yurtos-kernel
        run: deno task build-static
      - name: Browser acceptance
        timeout-minutes: 11
        working-directory: playground
        env:
          YURT_KERNEL_ROOT: ../yurtos-kernel
          PLAYGROUND_REQUIRE_ARTIFACTS: "1"
          SCENE: ${{ matrix.scene }}
        run: |
          set -euo pipefail
          if [ "$SCENE" != webkit ]; then
            exec deno run --allow-all "tests/${SCENE}_e2e.ts"
          fi
          # The same deno, workspace and deno cache, as this runner's user so
          # nothing in the workspace ends up owned by root. --init: deno is
          # not PID 1, so a timeout's signal stops it and WebKit.
          version=$(jq -r .imports.playwright deno.json)
          deno_dir=$(deno info --json | jq -r .denoDir)
          exec docker run --rm --init --ipc=host --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e DENO_DIR="$deno_dir" \
            -e YURT_KERNEL_ROOT -e PLAYGROUND_REQUIRE_ARTIFACTS \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$deno_dir:$deno_dir" \
            -v "$(command -v deno):/usr/local/bin/deno:ro" -w "$PWD" \
            "mcr.microsoft.com/playwright:v${version#npm:playwright@}-noble" \
            deno run --allow-all tests/webkit_e2e.ts

  # One context for the legs above, under the name `main`'s ruleset requires.
  # Renaming the single job they replaced would otherwise have orphaned that
  # requirement: the ruleset would wait for a check nobody reports (#123
  # review). Adding the seven leg names to the ruleset instead would mean a
  # settings change on every future split, and a leg that is skipped because
  # the token is absent would block the merge rather than explain itself.
  integration:
    name: integration (cross-repo)
    needs: [checks, tests, acceptance]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every leg passed, or said why it did not run
        env:
          CHECKS: ${{ needs.checks.result }}
          TOKEN_PRESENT: ${{ needs.checks.outputs.present }}
          TESTS: ${{ needs.tests.result }}
          EVENT: ${{ github.event_name }}
          ACCEPTANCE: ${{ needs.acceptance.result }}
        run: |
          set -euo pipefail
          echo "checks=$CHECKS token=$TOKEN_PRESENT tests=$TESTS acceptance=$ACCEPTANCE"
          # `checks` decides whether the legs run at all, so its own failure
          # has to fail here: otherwise a checkout or setup error before the
          # token step leaves `present` empty, the legs skipped, and this
          # gate green with "no token" as the reason (#123 review round 2).
          if [ "$CHECKS" != "success" ]; then
            echo "fmt / lint did not pass, so the cross-repo legs never ran" >&2
            exit 1
          fi
          case "$TOKEN_PRESENT" in
            true) ;;
            false)
              # A fork's pull request: GitHub withholds the secret, the legs
              # are skipped by design, and `checks` has already said so in
              # the job summary.
              echo "cross-repo legs did not run: no KERNEL_CHECKOUT_TOKEN"
              exit 0
              ;;
            *)
              echo "checks reported no token verdict ('$TOKEN_PRESENT')" >&2
              exit 1
              ;;
          esac
          # A push to main skips the test shards (deploy-pages.yml runs them).
          if [ "$EVENT" = push ] && [ "$TESTS" = skipped ]; then TESTS=success; fi
          [ "$TESTS" = "success" ] && [ "$ACCEPTANCE" = "success" ]
