name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # The playground-only gate. fmt and lint need no sibling checkout, so this is
  # the one signal that survives a missing cross-repo token. deno check is not
  # here: it resolves @yurt/* into the kernel checkout, so it belongs to the
  # integration job.
  checks:
    name: fmt / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          # Pinned, not v2.x: deno fmt's output changed between 2.x releases
          # (public/index.html reindents), so a floating formatter turns CI red
          # with no code change and disagrees with what developers run locally.
          deno-version: v2.7.14
      - name: fmt
        run: deno fmt --check
      - name: lint
        run: deno lint

  # yurtos-kernel, yurt-ports, and yurt-jupyter are PRIVATE, and the default
  # GITHUB_TOKEN cannot read another private repository. Without a PAT stored as
  # KERNEL_CHECKOUT_TOKEN the integration job cannot check them out at all, so
  # it announces that loudly instead of dying at "Repository not found".
  kernel-access:
    name: cross-repo checkout token
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.token.outputs.present }}
    steps:
      - name: Check for the cross-repo checkout token
        id: token
        env:
          KERNEL_CHECKOUT_TOKEN: ${{ secrets.KERNEL_CHECKOUT_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${KERNEL_CHECKOUT_TOKEN:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Integration did not run::KERNEL_CHECKOUT_TOKEN is not set, so the private YurtOS siblings could not be checked out. No kernel, image, or Jupyter payload was built and no artifact-backed test ran."
            {
              echo "### Integration: **not run**"
              echo
              echo '`KERNEL_CHECKOUT_TOKEN` is unset, so the private'
              echo '`yurtos-kernel`, `yurt-ports`, and `yurt-jupyter` checkouts'
              echo 'were skipped. Nothing was built and no artifact-backed test'
              echo 'ran — this is not coverage.'
              echo
              echo 'Add a PAT with read access to those repositories as the'
              echo '`KERNEL_CHECKOUT_TOKEN` repository secret to enable it.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  deno:
    name: integration (cross-repo)
    needs: kernel-access
    if: needs.kernel-access.outputs.present == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: playground
      - name: Read kernel pin
        id: pins
        working-directory: playground
        run: |
          echo "kernel_rev=$(jq -r .kernelWasm.rev artifacts/pins.json)" >> "$GITHUB_OUTPUT"
          echo "kernel_sha=$(jq -r .kernelWasm.sha256 artifacts/pins.json)" >> "$GITHUB_OUTPUT"
          echo "ports_rev=$(jq -r .image.rev artifacts/pins.json)" >> "$GITHUB_OUTPUT"
          echo "image_sha=$(jq -r .image.sha256 artifacts/pins.json)" >> "$GITHUB_OUTPUT"
          echo "jupyter_rev=$(jq -r .yurtJupyterRev artifacts/jupyter-requirements.lock)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: YurtOS/yurtos-kernel
          token: ${{ secrets.KERNEL_CHECKOUT_TOKEN }}
          ref: ${{ steps.pins.outputs.kernel_rev }}
          path: yurtos-kernel
      - uses: actions/checkout@v7
        with:
          repository: YurtOS/yurt-ports
          token: ${{ secrets.KERNEL_CHECKOUT_TOKEN }}
          ref: ${{ steps.pins.outputs.ports_rev }}
          path: yurt-ports
      - uses: actions/checkout@v7
        with:
          repository: YurtOS/yurt-jupyter
          token: ${{ secrets.KERNEL_CHECKOUT_TOKEN }}
          ref: ${{ steps.pins.outputs.jupyter_rev }}
          path: yurt-jupyter
      # No Rust toolchain here on purpose. This job consumes published
      # artifacts; the only Rust build left in the repo is
      # publish-kernel-wasm.yml, which produces them.
      - uses: denoland/setup-deno@v2
        with:
          # Pinned, not v2.x: deno fmt's output changed between 2.x releases
          # (public/index.html reindents), so a floating formatter turns CI red
          # with no code change and disagrees with what developers run locally.
          deno-version: v2.7.14
      - uses: actions/setup-python@v7
        id: host-python
        with:
          # Exact, not "3.14": the payload tree hash in
          # artifacts/jupyter-requirements.lock is only reproducible from the
          # interpreter that produced it — pip writes interpreter-dependent
          # dist-info — and a floating patch silently breaks it.
          python-version: "3.14.0"
          architecture: x64
      # The staged payload is not reproducible — pip resolves build backends
      # from PyPI at build time, and five builds with identical pins produced
      # five different trees — so it is published once and fetched, never
      # rebuilt here. Regenerate with the "Regenerate Jupyter payload"
      # workflow, which publishes to yurt-packages.
      - name: Install the Jupyter payload from its release
        working-directory: playground
        env:
          GH_TOKEN: ${{ secrets.KERNEL_CHECKOUT_TOKEN }}
          YURT_JUPYTER_ROOT: ../yurt-jupyter
        run: scripts/install-jupyter-payload.sh
      - name: Materialize locked Jupyter payload
        working-directory: playground
        env:
          HOST_PYTHON: ${{ steps.host-python.outputs.python-path }}
          YURT_JUPYTER_ROOT: ../yurt-jupyter
        run: deno run --allow-read --allow-write --allow-env --allow-run scripts/materialize-jupyter.ts
      - name: Restore the pinned kernel wasm
        id: kernel-wasm
        uses: actions/cache/restore@v4
        with:
          path: yurtos-kernel/target/kernel-wasm/release/yurt_kernel.wasm
          # Keyed on the pinned sha, not the kernel rev: the step below fetches a
          # published artifact, so the sha is what identifies it. Keyed on the rev,
          # a cache entry whose bytes do not match the pin would be served forever
          # and the fetch would never run -- the job then fails in the resolver,
          # which reads as a bad pin rather than a bad cache.
          key: kernel-wasm-${{ runner.os }}-${{ steps.pins.outputs.kernel_sha }}
      # Fetched, not rebuilt. The build is deterministic on a given host but not
      # across hosts: the pin recorded 99374d14... from a maintainer's machine,
      # and ubuntu-latest built the same rev twice and produced b0e161a0... both
      # times, so every CI run failed the pin check no matter how the cache was
      # keyed. Same move as the Jupyter payload and the playground image: consume
      # published bytes rather than re-derive them.
      #
      # The sha from artifacts/pins.json is passed in and checked before the wasm
      # is moved into place, so a wrong or corrupt asset fails here rather than
      # later as a kernel that will not instantiate.
      - name: Fetch pinned kernel wasm
        if: steps.kernel-wasm.outputs.cache-hit != 'true'
        working-directory: playground
        env:
          # yurt-packages is private, and the default github.token is scoped to
          # this repo only -- it 404s there.
          GH_TOKEN: ${{ secrets.KERNEL_CHECKOUT_TOKEN }}
        run: |
          scripts/install-kernel-wasm.sh \
            "${{ github.workspace }}/yurtos-kernel/target/kernel-wasm/release/yurt_kernel.wasm" \
            "$(jq -r .kernelWasm.sha256 artifacts/pins.json)"
      - name: Save the pinned kernel wasm
        if: steps.kernel-wasm.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: yurtos-kernel/target/kernel-wasm/release/yurt_kernel.wasm
          key: ${{ steps.kernel-wasm.outputs.cache-primary-key }}
      # The image is a published artifact now, identified by its sha rather than
      # by the inputs that produced it.
      - name: Restore the pinned playground image
        id: playground-image
        uses: actions/cache/restore@v4
        with:
          path: yurt-ports/ports/playground-image/build/dist/playground.yurtimg
          # Keyed on the image sha, not the source revs: the step below fetches a
          # published artifact, so the sha is what identifies it. Keying on revs
          # would serve a stale cached image after a re-publish at the same rev --
          # exactly what happened when playground-image-v0.0.1 was withdrawn.
          key: playground-image-${{ runner.os }}-${{ steps.pins.outputs.image_sha }}
      # Fetched, not rebuilt. Building it here ran the pinned kernel's
      # `make -C abi lib`, which builds musl and needs a wasi-sdk this workflow
      # never installed, so every cache miss failed with
      # "no wasi-sdk can compile for wasm32-linux-muslwali; set WASI_SDK_PATH".
      # Same move as jupyter-payload-v0.0.1: consume a published artifact and
      # drop the toolchain dependency rather than install a toolchain to
      # reproduce a byte-identical file.
      #
      # The sha from artifacts/pins.json is passed in and checked before the
      # image is moved into place, so a wrong or corrupt asset fails here rather
      # than later as an unbootable image.
      - name: Fetch pinned playground image
        if: steps.playground-image.outputs.cache-hit != 'true'
        working-directory: playground
        env:
          # yurt-packages is private, and the default github.token is scoped to
          # this repo only -- it 404s there. Same PAT the Jupyter payload fetch
          # above already uses against the same release repo.
          GH_TOKEN: ${{ secrets.KERNEL_CHECKOUT_TOKEN }}
        run: |
          scripts/install-playground-image.sh \
            "${{ github.workspace }}/yurt-ports/ports/playground-image/build/dist/playground.yurtimg" \
            "$(jq -r .image.sha256 artifacts/pins.json)"
      - name: Save the pinned playground image
        if: steps.playground-image.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: yurt-ports/ports/playground-image/build/dist/playground.yurtimg
          key: ${{ steps.playground-image.outputs.cache-primary-key }}
      - name: check
        working-directory: playground
        run: deno check "**/*.ts"
      - name: test
        working-directory: playground
        env:
          YURT_KERNEL_ROOT: ../yurtos-kernel
          YURT_PORTS_ROOT: ../yurt-ports
          PLAYGROUND_REQUIRE_ARTIFACTS: "1"
        run: deno test --no-check --allow-read --allow-write --allow-env --allow-net --allow-run
      - name: Materialize pinned browser artifacts
        working-directory: playground
        env:
          YURT_KERNEL_ROOT: ../yurtos-kernel
          YURT_PORTS_ROOT: ../yurt-ports
        run: deno run --allow-all scripts/pin-artifacts.ts
      - name: Install Chromium for browser acceptance
        working-directory: playground
        run: deno run --allow-all node_modules/playwright/cli.js install chromium
      - name: WorkerHost browser reproduction
        working-directory: playground
        env:
          YURT_KERNEL_ROOT: ../yurtos-kernel
          YURT_PORTS_ROOT: ../yurt-ports
          PLAYGROUND_REQUIRE_ARTIFACTS: "1"
        run: deno run --allow-all tests/workerhost_background_child_e2e.ts --mode workerhost-repro
      - name: Browser acceptance
        # Enable once the pinned kernel includes the #2361 WorkerHost fix.
        if: vars.YURT_JUPYTER_E2E == 'true'
        working-directory: playground
        env:
          YURT_KERNEL_ROOT: ../yurtos-kernel
          YURT_PORTS_ROOT: ../yurt-ports
          PLAYGROUND_REQUIRE_ARTIFACTS: "1"
        run: deno run --allow-all tests/playground_e2e.ts
