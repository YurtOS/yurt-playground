name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deno:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: fmt
        run: deno fmt --check
      - name: lint
        run: deno lint
      - name: check
        run: deno check '**/*.ts'
      - name: test
        run: deno test --allow-read --allow-env
