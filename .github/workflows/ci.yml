name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: playground
      - name: Read kernel pin
        id: pins
        working-directory: playground
        run: echo "kernel_rev=$(jq -r .kernelWasm.rev artifacts/pins.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: YurtOS/yurtos-kernel
          ref: ${{ steps.pins.outputs.kernel_rev }}
          path: yurtos-kernel
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: fmt
        working-directory: playground
        run: deno fmt --check
      - name: lint
        working-directory: playground
        run: deno lint
      - name: check
        working-directory: playground
        run: deno check "**/*.ts"
      - name: test
        working-directory: playground
        run: deno test --no-check --allow-read --allow-write --allow-env --allow-net --allow-run --allow-ffi --allow-sys
