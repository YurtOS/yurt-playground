name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # The playground-only gate. fmt and lint need no sibling checkout, so this is
  # the one signal that survives a missing cross-repo token. deno check is not
  # here: it resolves @yurt/* into the kernel checkout, so it belongs to the
  # integration job.
  checks:
    name: fmt / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          # Pinned, not v2.x: deno fmt's output changed between 2.x releases
          # (public/index.html reindents), so a floating formatter turns CI red
          # with no code change and disagrees with what developers run locally.
          deno-version: v2.7.14
      - name: fmt
        run: deno fmt --check
      - name: lint
        run: deno lint

  # yurtos-kernel, yurt-ports, and yurt-jupyter are PRIVATE, and the default
  # GITHUB_TOKEN cannot read another private repository. Without a PAT stored as
  # KERNEL_CHECKOUT_TOKEN the integration job cannot check them out at all, so
  # it announces that loudly instead of dying at "Repository not found".
  kernel-access:
    name: cross-repo checkout token
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.token.outputs.present }}
    steps:
      - name: Check for the cross-repo checkout token
        id: token
        env:
          KERNEL_CHECKOUT_TOKEN: ${{ secrets.KERNEL_CHECKOUT_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${KERNEL_CHECKOUT_TOKEN:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Integration did not run::KERNEL_CHECKOUT_TOKEN is not set, so the private YurtOS siblings could not be checked out. No kernel, image, or Jupyter payload was built and no artifact-backed test ran."
            {
              echo "### Integration: **not run**"
              echo
              echo '`KERNEL_CHECKOUT_TOKEN` is unset, so the private'
              echo '`yurtos-kernel`, `yurt-ports`, and `yurt-jupyter` checkouts'
              echo 'were skipped. Nothing was built and no artifact-backed test'
              echo 'ran — this is not coverage.'
              echo
              echo 'Add a PAT with read access to those repositories as the'
              echo '`KERNEL_CHECKOUT_TOKEN` repository secret to enable it.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  deno:
    name: integration (cross-repo)
    needs: kernel-access
    if: needs.kernel-access.outputs.present == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: playground
      - name: Read kernel pin
        id: pins
        working-directory: playground
        run: |
          echo "kernel_rev=$(jq -r .kernelWasm.rev artifacts/pins.json)" >> "$GITHUB_OUTPUT"
          echo "ports_rev=$(jq -r .image.rev artifacts/pins.json)" >> "$GITHUB_OUTPUT"
          echo "jupyter_rev=$(jq -r .yurtJupyterRev artifacts/jupyter-requirements.lock)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: YurtOS/yurtos-kernel
          token: ${{ secrets.KERNEL_CHECKOUT_TOKEN }}
          ref: ${{ steps.pins.outputs.kernel_rev }}
          path: yurtos-kernel
      - uses: actions/checkout@v7
        with:
          repository: YurtOS/yurt-ports
          token: ${{ secrets.KERNEL_CHECKOUT_TOKEN }}
          ref: ${{ steps.pins.outputs.ports_rev }}
          path: yurt-ports
      - uses: actions/checkout@v7
        with:
          repository: YurtOS/yurt-jupyter
          token: ${{ secrets.KERNEL_CHECKOUT_TOKEN }}
          ref: ${{ steps.pins.outputs.jupyter_rev }}
          path: yurt-jupyter
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32-wasip1,wasm32-wasip1-threads
          components: rust-src
      - uses: denoland/setup-deno@v2
        with:
          # Pinned, not v2.x: deno fmt's output changed between 2.x releases
          # (public/index.html reindents), so a floating formatter turns CI red
          # with no code change and disagrees with what developers run locally.
          deno-version: v2.7.14
      - uses: actions/setup-python@v6
        id: host-python
        with:
          python-version: "3.14"
          architecture: x64
      - name: Build locked Jupyter pure-Python input
        working-directory: playground
        env:
          HOST_PYTHON: ${{ steps.host-python.outputs.python-path }}
        run: |
          rm -rf "$RUNNER_TEMP/yurt-jupyter-site-py"
          mkdir -p "$RUNNER_TEMP/yurt-jupyter-site-py"
          mapfile -t packages < <(jq -r '.packages[] | select(.name != "pyzmq") | "\(.name)==\(.version)"' artifacts/jupyter-requirements.lock)
          "$HOST_PYTHON" -m pip install --no-binary=:all: --target "$RUNNER_TEMP/yurt-jupyter-site-py" "${packages[@]}"
          find "$RUNNER_TEMP/yurt-jupyter-site-py" -type f \( -name '*.so' -o -name '*.dylib' -o -name '*.pyd' \) -delete
          rm -rf "$RUNNER_TEMP/yurt-jupyter-site-py/zmq" "$RUNNER_TEMP/yurt-jupyter-site-py"/pyzmq-*.dist-info "$RUNNER_TEMP/yurt-jupyter-site-py/psutil"
          JUPYTER_SITE_PY="$RUNNER_TEMP/yurt-jupyter-site-py" ../yurt-jupyter/scripts/stage-jupyter-site-packages.sh
      - name: Materialize locked Jupyter payload
        working-directory: playground
        env:
          HOST_PYTHON: ${{ steps.host-python.outputs.python-path }}
          YURT_JUPYTER_ROOT: ../yurt-jupyter
        run: deno run --allow-read --allow-write --allow-env --allow-run scripts/materialize-jupyter.ts
      - name: Build pinned kernel wasm
        working-directory: yurtos-kernel
        run: scripts/build-kernel-wasm.sh
      - name: Materialize pinned playground image
        working-directory: yurt-ports
        env:
          YURT_KERNEL_ROOT: ${{ github.workspace }}/yurtos-kernel
          YURT_JUPYTER_STAGE: ${{ github.workspace }}/playground/artifacts/jupyter-site-packages
          HOST_PYTHON: ${{ steps.host-python.outputs.python-path }}
        run: |
          scripts/build-all-ports.sh --only zlib openssl sqlite libcxx libzmq busybox cpython numpy pyzmq --build-only
          ports/playground-image/scripts/package.sh
      - name: check
        working-directory: playground
        run: deno check "**/*.ts"
      - name: test
        working-directory: playground
        env:
          YURT_KERNEL_ROOT: ../yurtos-kernel
          YURT_PORTS_ROOT: ../yurt-ports
          PLAYGROUND_REQUIRE_ARTIFACTS: "1"
        run: deno test --no-check --allow-read --allow-write --allow-env --allow-net --allow-run
      # Enable after the pinned kernel provides the worker-backed Jupyter path.
      - name: Materialize pinned browser artifacts
        if: vars.YURT_JUPYTER_E2E == 'true'
        working-directory: playground
        env:
          YURT_KERNEL_ROOT: ../yurtos-kernel
          YURT_PORTS_ROOT: ../yurt-ports
        run: deno run --allow-all scripts/pin-artifacts.ts
      - name: Install Chromium for browser acceptance
        if: vars.YURT_JUPYTER_E2E == 'true'
        working-directory: playground
        run: deno run --allow-all node_modules/playwright/cli.js install chromium
      - name: Browser acceptance
        if: vars.YURT_JUPYTER_E2E == 'true'
        working-directory: playground
        env:
          YURT_KERNEL_ROOT: ../yurtos-kernel
          YURT_PORTS_ROOT: ../yurt-ports
          PLAYGROUND_REQUIRE_ARTIFACTS: "1"
        run: deno run --allow-all tests/playground_e2e.ts
