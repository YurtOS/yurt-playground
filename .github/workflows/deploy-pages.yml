name: Deploy playground

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  # The deploy needs the private YurtOS siblings (kernel, ports, jupyter) and a
  # Cloudflare Pages project. The default GITHUB_TOKEN cannot read another
  # private repository, so without these secrets the job cannot deploy at all —
  # it says so instead of failing at "Repository not found" or at the upload.
  secrets-present:
    name: deploy secrets
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - name: Check for the deploy secrets
        id: check
        env:
          KERNEL_CHECKOUT_TOKEN: ${{ secrets.KERNEL_CHECKOUT_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
        run: |
          set -euo pipefail
          missing=""
          for name in KERNEL_CHECKOUT_TOKEN CLOUDFLARE_API_TOKEN \
            CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_PROJECT_NAME; do
            eval "value=\${$name:-}"
            if [ -z "$value" ]; then missing="$missing $name"; fi
          done
          if [ -z "$missing" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Playground was not deployed::Missing secrets:$missing"
            {
              echo "### Deploy: **not run**"
              echo
              echo "Missing repository secrets:\`$missing\`"
              echo
              echo 'The site was not built or published.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    needs: secrets-present
    if: needs.secrets-present.outputs.present == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: playground
      - name: Read pins
        id: pins
        working-directory: playground
        run: |
          echo "kernel_rev=$(jq -r .kernelWasm.rev artifacts/pins.json)" >> "$GITHUB_OUTPUT"
          echo "ports_rev=$(jq -r .image.rev artifacts/pins.json)" >> "$GITHUB_OUTPUT"
          echo "jupyter_rev=$(jq -r .yurtJupyterRev artifacts/jupyter-requirements.lock)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: YurtOS/yurtos-kernel
          token: ${{ secrets.KERNEL_CHECKOUT_TOKEN }}
          ref: ${{ steps.pins.outputs.kernel_rev }}
          path: yurtos-kernel
      - uses: actions/checkout@v7
        with:
          repository: YurtOS/yurt-ports
          token: ${{ secrets.KERNEL_CHECKOUT_TOKEN }}
          ref: ${{ steps.pins.outputs.ports_rev }}
          path: yurt-ports
      - uses: actions/checkout@v7
        with:
          repository: YurtOS/yurt-jupyter
          token: ${{ secrets.KERNEL_CHECKOUT_TOKEN }}
          ref: ${{ steps.pins.outputs.jupyter_rev }}
          path: yurt-jupyter
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32-wasip1,wasm32-wasip1-threads
          components: rust-src
      - uses: denoland/setup-deno@v2
        with:
          # Pinned, not v2.x: deno fmt's output changed between 2.x releases
          # (public/index.html reindents), so a floating formatter turns CI red
          # with no code change and disagrees with what developers run locally.
          deno-version: v2.7.14
      - uses: actions/setup-python@v6
        id: host-python
        with:
          python-version: "3.14"
          architecture: x64
      - name: Build locked Jupyter pure-Python input
        working-directory: playground
        env:
          HOST_PYTHON: ${{ steps.host-python.outputs.python-path }}
        run: |
          rm -rf "$RUNNER_TEMP/yurt-jupyter-site-py"
          mkdir -p "$RUNNER_TEMP/yurt-jupyter-site-py"
          mapfile -t packages < <(jq -r '.packages[] | select(.name != "pyzmq") | "\(.name)==\(.version)"' artifacts/jupyter-requirements.lock)
          "$HOST_PYTHON" -m pip install --no-binary=:all: --target "$RUNNER_TEMP/yurt-jupyter-site-py" "${packages[@]}"
          find "$RUNNER_TEMP/yurt-jupyter-site-py" -type f \( -name '*.so' -o -name '*.dylib' -o -name '*.pyd' \) -delete
          rm -rf "$RUNNER_TEMP/yurt-jupyter-site-py/zmq" "$RUNNER_TEMP/yurt-jupyter-site-py"/pyzmq-*.dist-info "$RUNNER_TEMP/yurt-jupyter-site-py/psutil"
          JUPYTER_SITE_PY="$RUNNER_TEMP/yurt-jupyter-site-py" ../yurt-jupyter/scripts/stage-jupyter-site-packages.sh
      - name: Materialize locked Jupyter payload
        working-directory: playground
        env:
          HOST_PYTHON: ${{ steps.host-python.outputs.python-path }}
          YURT_JUPYTER_ROOT: ../yurt-jupyter
        run: deno run --allow-read --allow-write --allow-env --allow-run scripts/materialize-jupyter.ts
      - name: Build pinned kernel wasm
        working-directory: yurtos-kernel
        run: scripts/build-kernel-wasm.sh
      - name: Materialize pinned playground image
        working-directory: yurt-ports
        env:
          YURT_KERNEL_ROOT: ${{ github.workspace }}/yurtos-kernel
          YURT_JUPYTER_STAGE: ${{ github.workspace }}/playground/artifacts/jupyter-site-packages
          HOST_PYTHON: ${{ steps.host-python.outputs.python-path }}
        run: |
          scripts/build-all-ports.sh --only zlib openssl sqlite libcxx libzmq busybox cpython numpy pyzmq --build-only
          ports/playground-image/scripts/package.sh
      - name: Pin artifacts
        working-directory: playground
        env:
          YURT_KERNEL_ROOT: ../yurtos-kernel
          YURT_PORTS_ROOT: ../yurt-ports
        run: deno task pin
      - name: Verify playground
        working-directory: playground
        env:
          YURT_KERNEL_ROOT: ../yurtos-kernel
          YURT_PORTS_ROOT: ../yurt-ports
        run: |
          deno fmt --check
          deno lint
          deno check '**/*.ts'
          deno test --no-check --allow-read --allow-write --allow-env --allow-net --allow-run
      - name: Build static site
        working-directory: playground
        env:
          YURT_KERNEL_ROOT: ../yurtos-kernel
        run: |
          deno task build-static
          test -f dist/_headers
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
          directory: playground/dist
