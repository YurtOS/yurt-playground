name: Deploy playground

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  # The deploy needs the private YurtOS siblings (kernel, ports, jupyter) and a
  # Cloudflare Pages project. The default GITHUB_TOKEN cannot read another
  # private repository, so without these secrets the job cannot deploy at all —
  # it says so instead of failing at "Repository not found" or at the upload.
  secrets-present:
    name: deploy secrets
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - name: Check for the deploy secrets
        id: check
        env:
          KERNEL_CHECKOUT_TOKEN: ${{ secrets.KERNEL_CHECKOUT_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
        run: |
          set -euo pipefail
          missing=""
          for name in KERNEL_CHECKOUT_TOKEN CLOUDFLARE_API_TOKEN \
            CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_PROJECT_NAME; do
            eval "value=\${$name:-}"
            if [ -z "$value" ]; then missing="$missing $name"; fi
          done
          if [ -z "$missing" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Playground was not deployed::Missing secrets:$missing"
            {
              echo "### Deploy: **not run**"
              echo
              echo "Missing repository secrets:\`$missing\`"
              echo
              echo 'The site was not built or published.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    needs: secrets-present
    if: needs.secrets-present.outputs.present == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: playground
      - name: Read pins
        id: pins
        working-directory: playground
        run: |
          echo "kernel_rev=$(jq -r .kernelWasm.rev artifacts/pins.json)" >> "$GITHUB_OUTPUT"
          echo "kernel_sha=$(jq -r .kernelWasm.sha256 artifacts/pins.json)" >> "$GITHUB_OUTPUT"
          echo "ports_rev=$(jq -r .image.rev artifacts/pins.json)" >> "$GITHUB_OUTPUT"
          echo "image_sha=$(jq -r .image.sha256 artifacts/pins.json)" >> "$GITHUB_OUTPUT"
          echo "jupyter_rev=$(jq -r .yurtJupyterRev artifacts/jupyter-requirements.lock)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: YurtOS/yurtos-kernel
          token: ${{ secrets.KERNEL_CHECKOUT_TOKEN }}
          ref: ${{ steps.pins.outputs.kernel_rev }}
          path: yurtos-kernel
      - uses: actions/checkout@v7
        with:
          repository: YurtOS/yurt-ports
          token: ${{ secrets.KERNEL_CHECKOUT_TOKEN }}
          ref: ${{ steps.pins.outputs.ports_rev }}
          path: yurt-ports
      - uses: actions/checkout@v7
        with:
          repository: YurtOS/yurt-jupyter
          token: ${{ secrets.KERNEL_CHECKOUT_TOKEN }}
          ref: ${{ steps.pins.outputs.jupyter_rev }}
          path: yurt-jupyter
      # No Rust toolchain here on purpose. The deploy consumes the same three
      # published artifacts CI does; the only Rust build left in the repo is
      # publish-kernel-wasm.yml, which produces one of them.
      - uses: denoland/setup-deno@v2
        with:
          # Pinned, not v2.x: deno fmt's output changed between 2.x releases
          # (public/index.html reindents), so a floating formatter turns CI red
          # with no code change and disagrees with what developers run locally.
          deno-version: v2.7.14
      - uses: actions/setup-python@v7
        id: host-python
        with:
          # Exact, not "3.14": the payload tree hash in
          # artifacts/jupyter-requirements.lock is only reproducible from the
          # interpreter that produced it — pip writes interpreter-dependent
          # dist-info — and a floating patch silently breaks it.
          python-version: "3.14.0"
          architecture: x64
      # The staged payload is not reproducible — pip resolves build backends from
      # PyPI at build time — so the deploy fetches the same published bytes CI
      # tested rather than re-deriving a tree no test ever saw.
      - name: Install the Jupyter payload from its release
        working-directory: playground
        env:
          GH_TOKEN: ${{ secrets.KERNEL_CHECKOUT_TOKEN }}
          YURT_JUPYTER_ROOT: ../yurt-jupyter
        run: scripts/install-jupyter-payload.sh
      - name: Materialize locked Jupyter payload
        working-directory: playground
        env:
          HOST_PYTHON: ${{ steps.host-python.outputs.python-path }}
          YURT_JUPYTER_ROOT: ../yurt-jupyter
        run: deno run --allow-read --allow-write --allow-env --allow-run scripts/materialize-jupyter.ts
      # Fetched, not rebuilt — and for two separate reasons.
      #
      # The kernel wasm build is deterministic on a given host but not across
      # hosts, so a rebuild here can never match the pin a maintainer recorded.
      # The image build runs the pinned kernel's `make -C abi lib`, which builds
      # musl and needs a wasi-sdk this workflow never installed; that is what
      # turned this deploy red with "no wasi-sdk can compile for
      # wasm32-linux-muslwali".
      #
      # Both shas come from artifacts/pins.json and are checked before the file
      # is moved into place, so the deploy ships exactly the bytes CI tested.
      - name: Fetch pinned kernel wasm
        working-directory: playground
        env:
          # yurt-packages is private, and the default github.token 404s there.
          GH_TOKEN: ${{ secrets.KERNEL_CHECKOUT_TOKEN }}
        run: |
          scripts/install-kernel-wasm.sh \
            "${{ github.workspace }}/yurtos-kernel/target/kernel-wasm/release/yurt_kernel.wasm" \
            "${{ steps.pins.outputs.kernel_sha }}"
      - name: Fetch pinned playground image
        working-directory: playground
        env:
          GH_TOKEN: ${{ secrets.KERNEL_CHECKOUT_TOKEN }}
        run: |
          scripts/install-playground-image.sh \
            "${{ github.workspace }}/yurt-ports/ports/playground-image/build/dist/playground.yurtimg" \
            "${{ steps.pins.outputs.image_sha }}"
      - name: Pin artifacts
        working-directory: playground
        env:
          YURT_KERNEL_ROOT: ../yurtos-kernel
          YURT_PORTS_ROOT: ../yurt-ports
        run: deno task pin
      - name: Verify playground
        working-directory: playground
        env:
          YURT_KERNEL_ROOT: ../yurtos-kernel
          YURT_PORTS_ROOT: ../yurt-ports
        run: |
          deno fmt --check
          deno lint
          deno check '**/*.ts'
          deno test --no-check --allow-read --allow-write --allow-env --allow-net --allow-run
      - name: Build static site
        working-directory: playground
        env:
          YURT_KERNEL_ROOT: ../yurtos-kernel
        run: |
          deno task build-static
          test -f dist/_headers
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
          directory: playground/dist
