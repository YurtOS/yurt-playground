<!DOCTYPE html>
<html>
  <head><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval' 'sha256-/RtqkYwAxXkOIzSHDjbsxJ8kb2U05feU2xFLIxOTESE='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self' https://raw.githubusercontent.com/YurtOS/yurt-packages/; worker-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><script src="../../../isolation.js"></script>
    <script>
      // Handle workspace URLs by extracting the workspace name and redirecting to lab with query parameter
      (function () {
        const pathname = window.location.pathname;
        const workspaceMatch = pathname.match(/\/lab\/workspaces\/([^\/]+)/);

        if (workspaceMatch) {
          // Extract workspace name from URL
          const workspaceName = workspaceMatch[1];
          const baseUrl = window.location.origin + window.location.pathname.replace(/\/workspaces\/[^\/]+.*$/, '');
          const redirectUrl = `${baseUrl}/lab/index.html?workspace=${encodeURIComponent(workspaceName)}`;

          console.log('Workspace redirect:', redirectUrl);
          window.location.href = redirectUrl;
        } else {
          // Fallback: redirect to /lab by default
          window.location.href = window.location.href.replace(
            /(\/|\/index.html)?$/,
            '/../index.html'
          );
        }
      }.call(this));
    </script>
  </head>
</html>
