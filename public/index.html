<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Yurt playground</title>
    <link rel="stylesheet" href="./xterm.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #111;
        color: #eee;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      #status {
        margin: 0;
        padding: 8px 12px;
      }
      #term {
        height: 45vh;
      }
      #notebook {
        border-top: 1px solid #444;
        padding: 12px;
      }
      #notebook-input {
        display: block;
        width: min(720px, 95vw);
        min-height: 80px;
        margin-bottom: 8px;
        background: #222;
        color: #eee;
        font: inherit;
      }
      #notebook-output {
        min-height: 1.2em;
      }
    </style>
  </head>
  <body>
    <pre id="status">checking isolation</pre>
    <div id="term"></div>
    <section id="notebook" aria-label="Jupyter notebook" data-testid="notebook">
    </section>
    <script type="module">
      const status = document.getElementById("status");
      if (globalThis.crossOriginIsolated !== true) {
        status.textContent = "need COOP/COEP";
        throw new Error("not crossOriginIsolated");
      }
      status.textContent = "booting";
      await import("./boot.bundle.js");
    </script>
  </body>
</html>
