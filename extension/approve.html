<!DOCTYPE html>
<meta charset="utf-8">
<title>Yurt browser bridge</title>
<style>
  body {
    font: 14px/1.45 system-ui, sans-serif;
    margin: 20px;
    max-width: 420px;
  }
  h1 {
    font-size: 16px;
    margin: 0 0 10px;
  }
  p {
    margin: 0 0 12px;
    color: #444;
  }
  code {
    background: #f3f3f3;
    padding: 1px 4px;
    border-radius: 3px;
  }
  button {
    font: inherit;
    padding: 6px 14px;
    margin-right: 8px;
  }
</style>
<h1>Let a sandbox drive this browser?</h1>
<p>
  A Playwright script in the Yurt sandbox on <code id="origin"></code> asks to
  open tabs in this browser and control them.
</p>
<p>
  Those tabs use this browser's sign-ins and cookies. Allow it only if you
  started that script yourself. It lasts until that playground tab closes or
  reloads.
</p>
<button id="allow" type="button">Allow</button>
<button id="deny" type="button">Deny</button>
<script src="approve.js"></script>
